<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>كتالوج الأسعار</title>
<style>
:root{--bg:#f6f7f6;--card:#fff;--fg:#1b1f1e;--mut:#6b7370;--acc:#1f6f5c;--bd:#e3e6e4}
@media(prefers-color-scheme:dark){:root{--bg:#121514;--card:#1c211f;--fg:#eef1f0;--mut:#9aa5a1;--bd:#2b322f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"Geeza Pro",system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{position:sticky;top:0;background:var(--bg);padding:12px;border-bottom:1px solid var(--bd);z-index:2}
input[type=search]{width:100%;padding:12px 14px;font-size:17px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}.chip{flex:none;padding:6px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:15px}.sub2:empty{display:none}.sub2{padding-top:4px}.sub2 .chip{font-size:14px;background:transparent}.sub2 .chip.on{background:var(--acc)}.chip i{font-style:normal;opacity:.65;font-size:12px;margin-inline-start:6px}.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{padding:12px;max-width:900px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.nm{font-weight:700}.sub{color:var(--mut);font-size:14px}.pr{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}.pr div{min-width:84px}.pr small{display:block;color:var(--mut);font-size:12px}.pr b{font-size:18px;color:var(--acc);font-variant-numeric:tabular-nums}
.meta{color:var(--mut);font-size:13px;text-align:center;padding:8px}.empty{text-align:center;padding:40px 16px;color:var(--mut)}
button.pick{padding:12px 20px;font-size:17px;border-radius:12px;border:0;background:var(--acc);color:#fff;margin-top:12px}
</style></head><body>
<header><input id="q" type="search" aria-label="البحث في نسخة العرض" placeholder="ابحث باسم المنتج أو الماركة…" autocomplete="off"><div class="chips" id="chips"></div><div class="chips sub2" id="chips2"></div></header>
<main><div id="meta" class="meta"></div><div id="list"></div></main>
<input id="file" type="file" accept=".json,application/json" hidden>
<script type="module" src="app.js"></script></body></html>
